name: Build FloodlightFC Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - '**.godot'
      - 'export_presets.cfg'
      - '.github/workflows/android-apk.yml'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare build directory
        run: mkdir -p build

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android debug APK
        run: godot --headless --path . --export-debug "Android" build/FloodlightFC-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloodlightFC-Android-debug
          path: build/FloodlightFC-debug.apk
          if-no-files-found: error
          retention-days: 14
